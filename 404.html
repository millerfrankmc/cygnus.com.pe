<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Cygnus Consulting</title>
    <script>
      // SPA redirect workaround for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') +
        '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- Fallback visible solo si el redirect JS no corre (crawlers, JS deshabilitado). -->
    <p style="font-family: sans-serif; padding: 2rem; color: #212121;">
      Página no encontrada.
      <a href="https://cygnus.com.pe/" style="color: #1863dc;">Ir al inicio de Cygnus Consulting</a>.
    </p>
  </body>
</html>
