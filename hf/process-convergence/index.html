    <script>
      window.__timelines = window.__timelines || {};
      gsap.registerPlugin(MotionPathPlugin, CustomEase);
      const EASE = CustomEase.create('mrnEase', 'M0,0 C0.16,1 0.3,1 1,1');
      const tl = gsap.timeline({ paused: true });

// Hub: opacity + scale (8–30f)
tl.fromTo('#hub', {opacity:0, scale:0.95}, {opacity:1, scale:1, duration:0.7333, ease:EASE}, 0.2667);
tl.fromTo('#hub-tag', {opacity:0}, {opacity:1, duration:0.6000, ease:EASE}, 0.7333);
// Órbita: fade-in (34–52f) + marcha del dash. Un solo tween lineal
// 0 → -480 (el patrón es periódico, dasharray 4+10=14: offset -f ≡ -(f % 14))
tl.fromTo('#orbit', {opacity:0}, {opacity:1, duration:0.6000, ease:EASE}, 1.1333);
tl.fromTo('#orbit', {strokeDashoffset:0}, {strokeDashoffset:-480, duration:16.0000, ease:'none'}, 0);

// Tarjetas: cascada (stagger 9f) + micro-stagger interno (chip 0 / texto 4 / barras 8 / addon 12)
